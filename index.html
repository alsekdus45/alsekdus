<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 첫 사이트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.6;
      color: #222;
      background: #f7f7f9;
    }
    header {
      background: #4f46e5;
      color: #fff;
      text-align: center;
      padding: 80px 20px;
    }
    header h1 { font-size: 2.2rem; margin-bottom: 12px; }
    header p { font-size: 1.1rem; opacity: 0.9; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
    section {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    section h2 { margin-bottom: 10px; color: #4f46e5; }
    a { color: #4f46e5; }
    footer { text-align: center; padding: 30px; color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>안녕하세요! 👋</h1>
    <p>GitHub Pages로 만든 저의 첫 사이트입니다.</p>
  </header>

  <main>
    <section>
      <h2>소개</h2>
      <p>여기에 자기소개나 사이트 설명을 적어보세요.</p>
    </section>

    <section>
      <h2>프로젝트</h2>
      <p>만든 것이나 하고 있는 일을 소개해 보세요.</p>
    </section>

    <section>
      <h2>연락처</h2>
      <p>이메일: <a href="mailto:example@email.com">example@email.com</a></p>
    </section>
  </main>

  <footer>© 2026 내 첫 사이트</footer>
</body>
</html>
